<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ContactDock</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="app">
      <header class="toolbar">
        <div class="toolbar-brand">
          <span class="brand-tab" aria-hidden="true"></span>
          <span class="brand-name">ContactDock</span>
        </div>
        <div class="toolbar-search">
          <input id="search-input" type="search" placeholder="Search name, phone, email…" autocomplete="off" />
        </div>
        <div class="toolbar-actions">
          <button id="btn-new" class="btn btn-accent" title="New contact">+ New</button>
          <button id="btn-duplicates" class="btn" title="Find duplicate contacts">
            Duplicates <span id="dup-badge" class="badge" hidden>0</span>
          </button>
          <div class="toolbar-menu">
            <button id="btn-import" class="btn" title="Import vCard (.vcf)">Import</button>
            <button id="btn-export" class="btn" title="Export all contacts as vCard (.vcf)">Export</button>
          </div>
        </div>
      </header>

      <main class="layout">
        <aside class="sidebar">
          <div class="sidebar-controls">
            <label class="sort-label" for="sort-select">Sort</label>
            <select id="sort-select">
              <option value="first">First name</option>
              <option value="last">Last name</option>
              <option value="recent">Recently updated</option>
              <option value="favorites">Favorites first</option>
            </select>
          </div>
          <div class="sidebar-controls">
            <label class="sort-label" for="source-select">Source</label>
            <select id="source-select">
              <option value="__all__">All sources</option>
            </select>
            <button id="btn-remove-source" class="btn-remove-field" title="Remove all contacts from this source" hidden>✕</button>
          </div>
          <div class="list-and-rail">
            <div id="contact-list" class="contact-list" role="listbox" aria-label="Contacts"></div>
            <div id="az-rail" class="az-rail" hidden></div>
          </div>
          <div id="empty-state" class="empty-state" hidden>
            <p>No contacts yet.</p>
            <button id="btn-empty-new" class="btn btn-accent">Add your first contact</button>
          </div>
        </aside>

        <section id="detail-pane" class="detail-pane">
          <div id="detail-placeholder" class="detail-placeholder">
            <div class="placeholder-tab" aria-hidden="true"></div>
            <p>Select a contact, or create a new one.</p>
          </div>
          <form id="contact-form" class="contact-form" hidden>
            <div class="form-header">
              <div class="avatar" id="form-avatar">?</div>
              <div class="form-header-fields">
                <input id="field-first" type="text" placeholder="First name" autocomplete="off" />
                <input id="field-last" type="text" placeholder="Last name" autocomplete="off" />
                <input id="field-org" type="text" placeholder="Company / organization" autocomplete="off" />
              </div>
              <button type="button" id="btn-favorite" class="btn-star" title="Toggle favorite" aria-pressed="false">★</button>
            </div>

            <div class="form-section">
              <div class="form-section-head">
                <h3>Phone</h3>
                <button type="button" class="btn-add-field" data-add="phone">+ Add phone</button>
              </div>
              <div id="phones-list" class="field-list"></div>
            </div>

            <div class="form-section">
              <div class="form-section-head">
                <h3>Email</h3>
                <button type="button" class="btn-add-field" data-add="email">+ Add email</button>
              </div>
              <div id="emails-list" class="field-list"></div>
            </div>

            <div class="form-section">
              <h3>Notes</h3>
              <textarea id="field-notes" rows="4" placeholder="Notes…"></textarea>
            </div>

            <div class="form-footer">
              <span id="form-meta" class="form-meta"></span>
              <button type="button" id="btn-delete" class="btn btn-danger">Delete</button>
            </div>
          </form>
        </section>
      </main>

      <footer class="statusbar">
        <span id="contact-count">0 contacts</span>
        <div class="statusbar-actions">
          <button id="btn-clear-all" class="link-btn link-btn-danger" title="Delete all contacts">Clear all</button>
          <button id="btn-data-location" class="link-btn" title="Open the folder where your data is stored">Data location</button>
        </div>
      </footer>
    </div>

    <div id="dup-modal" class="modal" hidden>
      <div class="modal-panel modal-wide">
        <div class="modal-head">
          <h2>Possible duplicates</h2>
          <button id="btn-dup-close" class="btn-icon" aria-label="Close">✕</button>
        </div>
        <div id="dup-body" class="modal-body"></div>
      </div>
    </div>

    <div id="toast" class="toast" hidden></div>

    <input id="import-file-input" type="file" accept=".vcf,text/vcard" multiple hidden />

    <script type="module" src="app.js"></script>
  </body>
</html>
